[build]
command = "npm run build"
publish = "dist"

[build.environment]
# Production API URL must point to Render backend
# This ensures Vite injects the correct URL during build
VITE_API_URL = "https://financeos-backend-j6ex.onrender.com/api/v1"
VITE_APP_NAME = "FinanceOS"

[[redirects]]
# Handle client-side routing: redirect all non-existent files to index.html
from = "/*"
to = "/index.html"
status = 200
